<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Catálogo NFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#150128;
  --painel:#200a3c;
  --tile:#2b0f52;
  --tile-alto:#3c1670;
  --linha:#6a2fc0;
  --topo-fundo-1:#4a12a0;
  --topo-fundo-2:#1a0338;
  --topo-linha:#b048f0;
  --topo-input:#260a4a;
  --texto:#f3e9ff;
  --mudo:#c090e8;
  --ouro:#ff2ee0;
  --verde:#5cb85c;
  --verde-escuro:#3f8c3f;
  --pixel:"Silkscreen","Courier New",monospace;
  --corpo:"Nunito Sans",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fundo);
  color:var(--texto);
  font-family:var(--corpo);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ouro)}

/* ---------- topo ---------- */
.topo{
  background:linear-gradient(180deg,var(--topo-fundo-1),var(--topo-fundo-2));
  border-bottom:2px solid var(--topo-linha);
  position:sticky;top:0;z-index:20;
}
.topo-int{
  max-width:1120px;margin:0 auto;padding:14px 18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.marca{
  display:flex;align-items:center;gap:10px;
  font-family:var(--pixel);font-size:17px;letter-spacing:.5px;
  color:var(--ouro);text-decoration:none;line-height:1.2;
}
.marca img{width:34px;height:34px;flex-shrink:0}
.marca-sub{display:block;font-size:9px;color:var(--mudo);letter-spacing:1px;margin-top:3px}
.busca{
  flex:1;min-width:160px;background:var(--topo-input);border:1px solid var(--topo-linha);
  border-radius:6px;padding:9px 12px;color:var(--texto);font-size:14px;
}
.busca::placeholder{color:#a066c8}
.busca:focus{outline:2px solid var(--ouro);outline-offset:1px}
.btn-discord{
  background:linear-gradient(180deg,#a83cf0,#6c1cc0);border:none;border-bottom:3px solid #4a1090;border-radius:6px;
  color:#fff;font-family:var(--pixel);font-size:11px;letter-spacing:1.5px;padding:10px 14px;text-decoration:none;
  display:inline-block;
}
.btn-discord:active{border-bottom-width:1px;transform:translateY(2px)}

/* ---------- abas ---------- */
.abas{max-width:1120px;margin:0 auto;padding:22px 18px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aba{
  background:var(--tile);border:1px solid var(--linha);border-bottom:3px solid var(--linha);
  border-radius:6px;padding:9px 16px;font-family:var(--pixel);font-size:11px;color:var(--mudo);
}
.aba[aria-selected="true"]{background:var(--ouro);color:#3a0050;border-color:#b800b8}
.aviso-legal{
  margin-left:auto;max-width:640px;font-size:11px;line-height:1.5;color:var(--mudo);
  opacity:.75;text-align:right;
}
@media(max-width:760px){.aviso-legal{margin-left:0;max-width:100%;text-align:left}}
.linha-info-grade{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;
}
.contador-itens{
  font-family:var(--pixel);font-size:10px;color:var(--mudo);margin:0;
}
.dica-clique{
  font-family:var(--pixel);font-size:10px;color:var(--mudo);opacity:.75;margin:0;
  display:flex;align-items:center;gap:6px;
}
.icone-clique{width:14px;height:14px;flex:none}

/* ---------- grade ---------- */
.envoltorio{max-width:1120px;margin:0 auto;padding:18px}
.grade{
  display:grid;gap:16px;
  grid-template-columns:repeat(4,1fr);
}
@media(max-width:880px){.grade{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grade{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){.grade{grid-template-columns:1fr}}
.card{
  background:var(--tile);border:1px solid var(--linha);border-bottom:3px solid #140026;
  border-radius:8px;padding:0;text-align:left;overflow:hidden;
  display:flex;flex-direction:column;
}
.card:hover,.card:focus-visible{background:var(--tile-alto);outline:none;border-color:var(--ouro)}
.card:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.palco{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(0deg,rgba(0,0,0,.25),rgba(0,0,0,0)),
    repeating-conic-gradient(#200a3c 0% 25%,#280d48 0% 50%) 0 0/16px 16px;
  padding:6px;
}
.palco img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;image-rendering:pixelated}
.vazio{font-family:var(--pixel);font-size:9px;color:#a888d0;text-align:center;padding:0 8px}
.card-txt{padding:10px 11px 12px}
.card-pt{display:block;font-weight:800;font-size:14px;line-height:1.25}
.card-en{display:block;font-size:12px;color:var(--mudo);margin-top:2px}
.card-en-linha{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:2px}
.card-en-linha .card-en{margin-top:0}
.card-faixa{font-family:var(--pixel);font-size:11px;letter-spacing:1px;color:var(--ouro);flex:none}
.cifra-apagada{opacity:.25}

/* ---------- item ---------- */
.voltar{
  background:none;border:none;font-family:var(--pixel);font-size:10px;
  color:var(--mudo);padding:0;margin-bottom:16px;
}
.voltar:hover{color:var(--ouro)}
.item{display:grid;gap:22px;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media(max-width:760px){.item{grid-template-columns:1fr}}
.vitrine{
  background:var(--painel);border:1px solid var(--linha);border-radius:10px;
  padding:18px;display:flex;align-items:center;justify-content:center;min-height:240px;
}
.vitrine img{max-height:220px;width:auto;image-rendering:pixelated}
.item h1{font-family:var(--pixel);font-size:20px;line-height:1.4;margin:0}
.item-en{color:var(--mudo);font-size:15px;margin:6px 0 0}
.selo{
  display:inline-block;background:var(--tile);border:1px solid var(--linha);
  border-radius:20px;padding:3px 11px;font-size:12px;color:var(--mudo);margin-top:12px;margin-right:6px;
}
.desc{margin:16px 0 0;max-width:62ch;color:#e6d4fa}
.cta{
  display:inline-block;margin-top:18px;background:linear-gradient(180deg,#ff2ee0,#b800a0);border:none;
  border-bottom:3px solid #8a0078;border-radius:7px;color:#fff;
  font-family:var(--pixel);font-size:12px;padding:13px 20px;text-decoration:none;
}
.cta:active{border-bottom-width:1px;transform:translateY(2px)}

.secao{margin-top:34px}
.secao h2{font-family:var(--pixel);font-size:12px;color:var(--mudo);margin:0 0 12px}
.gifs{display:flex;gap:12px;flex-wrap:wrap}
.gifs figure{
  margin:0;background:var(--painel);border:1px solid var(--linha);border-radius:10px;
  padding:14px 18px;min-width:120px;text-align:center;
}
.gifs img{image-rendering:pixelated;margin:0 auto}
.gifs figcaption{font-size:11px;color:var(--mudo);margin-top:8px}

/* ---------- provador ---------- */
.provador{
  background:var(--painel);border:1px solid var(--linha);border-radius:10px;
  display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden;
}
@media(max-width:700px){.provador{grid-template-columns:1fr}}
.espelho{
  background:
    linear-gradient(180deg,#3a1670,#200a3c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 14px;gap:14px;border-right:1px solid var(--linha);
}
.espelho img{height:160px;width:auto;image-rendering:pixelated}
.provador-editor{align-items:start;overflow:visible}
.provador-editor .espelho{
  position:sticky;top:16px;align-self:start;border-radius:10px 0 0 10px;
  padding-top:28px;padding-bottom:28px;
}
.provador-editor .espelho img{height:200px}
@media(max-width:700px){
  .provador-editor .espelho{position:static;border-radius:10px 10px 0 0}
}
.girar{display:flex;gap:8px}
.mini{
  background:var(--tile);border:1px solid var(--linha);border-bottom:2px solid #140026;
  border-radius:5px;width:34px;height:30px;font-size:14px;line-height:1;
}
.mini:hover{background:var(--tile-alto)}
.controles{padding:18px}
.campo{margin-bottom:15px}
.campo label{display:block;font-size:12px;color:var(--mudo);margin-bottom:6px}
.opcoes{display:flex;gap:7px;flex-wrap:wrap}
.opt{
  background:var(--tile);border:1px solid var(--linha);border-radius:5px;
  padding:6px 11px;font-size:13px;color:var(--mudo);
}
.opt[aria-pressed="true"]{background:var(--ouro);color:#3a0050;border-color:#b800b8;font-weight:700}
.cor{width:26px;height:26px;padding:0;border-radius:50%}
.cor[aria-pressed="true"]{outline:2px solid var(--ouro);outline-offset:2px;border-color:#fff}
.figura{
  width:100%;background:var(--fundo);border:1px solid var(--linha);border-radius:6px;
  padding:8px 10px;color:var(--texto);font-size:14px;font-family:var(--corpo);
}
.figura:focus{outline:2px solid var(--ouro);outline-offset:1px;color:var(--texto)}
.dica{font-size:12px;color:var(--mudo);margin:4px 0 0}
.linha-nick{display:flex;gap:7px}
.linha-nick .figura{flex:1}
.linha-nick .opt{white-space:nowrap}
.rodape{
  max-width:1120px;margin:46px auto 0;padding:20px 18px 40px;
  border-top:1px solid var(--linha);color:var(--mudo);font-size:13px;
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- autenticação / favoritos ---------- */
.auth-area{font-size:12px;color:var(--mudo);display:flex;align-items:center;gap:8px}
.auth-entrar,.auth-sair{
  background:none;border:1px solid var(--topo-linha);color:var(--texto);
  border-radius:5px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--corpo);
  text-decoration:none;display:inline-block;
}
.auth-nick{color:var(--texto);font-weight:600}
.link-editor{border-color:var(--ouro);color:var(--ouro)}
.link-editor:hover{background:var(--ouro);color:#3a0050}

.card-cabecalho{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.coracao{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--mudo);font-size:12px;padding:2px;flex-shrink:0;cursor:pointer;font-family:var(--corpo);
}
.coracao-icone{font-size:15px;line-height:1}
.coracao[aria-pressed="true"]{color:var(--ouro)}
.coracao-grande{font-size:16px}
.coracao-grande .coracao-icone{font-size:22px}

.admin-painel{
  position:fixed;bottom:16px;right:16px;background:var(--painel);
  border:1px solid var(--linha);border-radius:10px;padding:16px;width:240px;
  z-index:90;box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.admin-painel h3{font-family:var(--pixel);font-size:12px;margin:0 0 8px}
.admin-painel label{display:block;font-size:11px;color:var(--mudo);margin-top:8px}
.admin-painel label input{width:100%;margin-top:4px}

.opcoes-itens{display:grid;grid-template-columns:repeat(auto-fill,104px);gap:8px;justify-content:center}
@media(max-width:520px){.opcoes-itens{grid-template-columns:repeat(auto-fill,80px)}}
.item-mini{
  width:104px;height:104px;padding:4px;border-radius:8px;flex-shrink:0;position:relative;
  border:2px solid var(--linha);cursor:pointer;
  background:repeating-conic-gradient(#200a3c 0% 25%,#280d48 0% 50%) 0 0/10px 10px;
  display:flex;align-items:center;justify-content:center;
}
.item-mini[aria-pressed="true"]{border-color:var(--ouro)}
.item-mini img{max-width:100%;max-height:100%}
.item-mini::after{
  content:attr(data-codigo);position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:#0c0016;color:var(--texto);font-size:11px;padding:3px 7px;border-radius:4px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:5;
  border:1px solid var(--linha);
}
.item-mini:hover::after,.item-mini:focus::after{opacity:1}
@media(max-width:520px){.item-mini{width:80px;height:80px}}
.item-mini[aria-pressed="true"]{border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro)}
.selo-origem{
  position:absolute;top:2px;left:2px;width:30px;height:30px;z-index:4;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));pointer-events:none;
}
</style>
</head>

/* --------- montagem da figure string e das URLs do habbo-imaging -------- */

function figura(estado, peca){
  const partes = { ...BASE };
  partes.hd = "hd-180-" + estado.pele;
  partes.hr = "hr-" + estado.cabelo + "-" + estado.corCabelo;
  const lista = Object.values(partes);
  if (peca) {
    const tipo = peca.split("-")[0];
    const i = lista.findIndex(p => p.split("-")[0] === tipo);
    if (i >= 0) lista[i] = peca; else lista.push(peca);
  }
  return lista.join(".");
}

function urlAvatar(fig, o = {}){
  const q = new URLSearchParams({
    figure: fig,
    direction: o.dir ?? 2,
    head_direction: o.dir ?? 2,
    action: o.acao ?? "std",
    gesture: o.gesto ?? "std",
    size: o.size ?? "l",
    img_format: o.formato ?? "png",
    gender: o.genero ?? "M"
  });
  return HOTEL + "/habbo-imaging/avatarimage?" + q;
}

// Arte do card: a imagem do item quando existir, senão o avatar vestindo a peça.
function arteDoItem(it){
  if (it.img) return it.img;
  if (it.peca) return urlAvatar(figura(prov, it.peca), { dir:2, size:"l", genero: it.genero || "M" });
  return "";
}

function cardArte(it, altura){
  const src = arteDoItem(it);
  if (!src) return `<div class="vazio">Sem imagem cadastrada</div>`;
  return `<img src="${esc(src)}" alt="${esc(it.pt)}" loading="lazy"
    onerror="this.outerHTML='&lt;div class=\\'vazio\\'&gt;Sem imagem cadastrada&lt;/div&gt;'">`;
}

}

/* ------------------------------ telas ---------------------------------- */

function faixaHTML(faixa){
  const n = Math.max(0, Math.min(4, parseInt(faixa, 10) || 0));
  if (!n) return "";
  let out = "";
  for (let i = 1; i <= 4; i++) out += `<span class="${i <= n ? "" : "cifra-apagada"}">$</span>`;
  return `<span class="card-faixa" title="Faixa de preço">${out}</span>`;
}

function cardsHTML(lista, msgVazio){
  if (!lista.length) return `<p style="color:var(--mudo)">${msgVazio}</p>`;
  return lista.map(it => `
    <div class="card" tabindex="0" data-slug="${it.slug}">
      <span class="palco">${cardArte(it)}</span>
      <span class="card-txt">
        <span class="card-cabecalho">
          <span class="card-pt">${esc(it.pt)}</span>
          ${coracaoHTML(it.slug)}
        </span>
        <span class="card-en-linha">
          <span class="card-en">${esc(it.en)}</span>
          ${faixaHTML(it.faixa)}
        </span>
      </span>
    </div>`).join("");
}

async function carregarFiguredataCompleto(){
  if (FIGUREDATA_COMPLETO || editorCarregando) return;
  editorCarregando = true;
  editorErroCarregar = "";
  telaEditor();
  try {
    const r = await apiFetch(API_BASE + "/api/figuredata");
    const dados = await r.json();
    if (!r.ok || dados.erro) throw new Error(dados.erro || "erro");
    FIGUREDATA_COMPLETO = dados;
    editorTipoAtivo = Object.keys(dados.settypes)[0] || null;
  } catch (e) {
    editorErroCarregar = "Não consegui carregar a lista completa de itens agora. Recarregue a página em alguns minutos.";
  } finally {
    editorCarregando = false;
    telaEditor();
  }
}

function pecaParaFigura(tipo, sel){
  if (!sel) return null;
  const cor1 = sel.colors[0] || "1";
  const cor2 = sel.colors[1] ? "-" + sel.colors[1] : "";
  return tipo + "-" + sel.id + "-" + cor1 + cor2;
}

EXCLUIR_ITENS_EDITOR.hr = new Set(["4269","4270","9534","6508"]);

const INDICE_ITENS_EDITOR = {};
for (const tipo in INFO_ITENS_EDITOR) {
  const mapa = {};
  INFO_ITENS_EDITOR[tipo].forEach((e, i) => { mapa[e.id] = { ...e, ordem: i }; });
  INDICE_ITENS_EDITOR[tipo] = mapa;
}

// Peças de "hd" que substituem a cabeça inteira — quando uma destas está
// selecionada, o cabelo (hr) não deve aparecer por cima, mesmo que esteja escolhido.
const HD_SEM_CABELO_EDITOR = new Set(["6519","6520"]);

function removerCabeloEditor(lista){
  return lista.filter(p => p.split("-")[0] !== "hr");
}

function figuraMultipla(){
  let lista;
  if (prov.figLivre.trim()) {
    lista = prov.figLivre.trim().split(".").filter(Boolean);
  } else {
    const base = BASE_POR_GENERO[prov.genero] || BASE_POR_GENERO.M;
    lista = [base.hd, base.hr, base.ch, base.lg];
  }
  Object.entries(editorSelecionados).forEach(([tipo, sel]) => {
    const codigo = pecaParaFigura(tipo, sel);
    const i = lista.findIndex(p => p.split("-")[0] === tipo);
    if (codigo) { if (i >= 0) lista[i] = codigo; else lista.push(codigo); }
    else if (i >= 0) { lista.splice(i, 1); }
  });
  const hdSelecionado = editorSelecionados.hd;
  if (hdSelecionado && HD_SEM_CABELO_EDITOR.has(hdSelecionado.id)) lista = removerCabeloEditor(lista);
  return lista.join(".");
}

function figuraComCandidatoEditor(tipo, set){
  let lista = figuraMultipla().split(".").filter(Boolean);
  const paleta = FIGUREDATA_COMPLETO.palettes[FIGUREDATA_COMPLETO.settypes[tipo].paletteid] || [];
  const corPadrao = (paleta[0] || { id: "1" }).id;
  const codigo = tipo + "-" + set.id + "-" + corPadrao + (set.maxCor >= 2 ? "-" + corPadrao : "");
  const i = lista.findIndex(p => p.split("-")[0] === tipo);
  if (i >= 0) lista[i] = codigo; else lista.push(codigo);
  if (tipo === "hd" && HD_SEM_CABELO_EDITOR.has(set.id)) lista = removerCabeloEditor(lista);
  return lista.join(".");
}

function urlMiniaturaEditor(tipo, set){
  const fig = figuraComCandidatoEditor(tipo, set);
  const url = urlAvatar(fig, { dir: 2, size: "l", genero: prov.genero, acao: "std" });
  return TIPOS_CABECA_EDITOR.has(tipo) ? url + "&headonly=1" : url;
}

    .concat(disponiveisEditor.filter(t => !ORDEM_CATEGORIAS_EDITOR.includes(t)));

    const nick = campoNickEditor.value.trim();
    if (!nick) return;
    avisoEditor.textContent = "Procurando " + nick + "...";
    try {
      const url = PROXY
        ? PROXY + encodeURIComponent(nick)
        : HOTEL + "/api/public/users?name=" + encodeURIComponent(nick);
      const r = PROXY ? await apiFetch(url) : await fetch(url);
      if (!r.ok) throw new Error("nao encontrado");
      const dados = await r.json();
      if (!dados.figureString) throw new Error("sem visual");
      prov.figLivre = dados.figureString;
      prov.nick = nick;
      if (dados.gender) prov.genero = dados.gender;

      atualizarEditor();
    } catch (e) {
      avisoEditor.textContent = "Não achei esse nick. Confira se está escrito igualzinho e se o perfil está público.";
    }
  }

  document.getElementById("buscarNickEditor").onclick = buscarNickEditor;
  campoNickEditor.onkeydown = e => { if (e.key === "Enter") buscarNickEditor(); };

  atualizarEditor();
}

            <input class="figura" id="nick" placeholder="Seu nick no Habbo" value="${esc(prov.nick)}">
            <button class="opt" id="buscarNick">Carregar</button>
          </div>
          <p class="dica" id="avisoNick">O item é aplicado por cima do seu visual.</p>
        </div>
        <details class="campo">
          <summary class="dica" style="cursor:pointer">Colar o visual manualmente</summary>
          <input class="figura" id="figLivre" style="margin-top:8px"
                 placeholder="hd-180-1.hr-828-45.ch-210-66..." value="${esc(prov.figLivre)}">
        </details>
      </div>
    </div>
  </section>`;
}

function ligarProvador(it){
  const img = document.getElementById("espelhoImg");

  function atualizar(){
    let fig;
    if (prov.figLivre.trim()) {
      const partes = prov.figLivre.trim().split(".").filter(Boolean);
      const tipo = it.peca.split("-")[0];
      const i = partes.findIndex(p => p.split("-")[0] === tipo);
      if (i >= 0) partes[i] = it.peca; else partes.push(it.peca);
      fig = partes.join(".");
    } else {
      fig = figura(prov, it.peca);
    }
    img.src = urlAvatar(fig, { dir:prov.dir, acao:prov.acao, size:"l", genero:prov.genero });
  }

  app.querySelectorAll("[data-campo]").forEach(b => b.onclick = () => {
    prov[b.dataset.campo] = b.dataset.valor;
    app.querySelectorAll(`[data-campo="${b.dataset.campo}"]`)
       .forEach(o => o.setAttribute("aria-pressed", o === b));
    atualizar();
  });

  document.getElementById("girarEsq").onclick = () => { prov.dir = (prov.dir + 7) % 8; atualizar(); };
  document.getElementById("girarDir").onclick = () => { prov.dir = (prov.dir + 1) % 8; atualizar(); };
  document.getElementById("figLivre").oninput = e => { prov.figLivre = e.target.value; atualizar(); };

  const campoNick = document.getElementById("nick");
  const aviso = document.getElementById("avisoNick");

  async function buscarNick(){
    const nick = campoNick.value.trim();
    if (!nick) return;
    aviso.textContent = "Procurando " + nick + "...";
    try {
      const url = PROXY
        ? PROXY + encodeURIComponent(nick)
        : HOTEL + "/api/public/users?name=" + encodeURIComponent(nick);
      const r = PROXY ? await apiFetch(url) : await fetch(url);
      if (!r.ok) throw new Error("nao encontrado");
      const dados = await r.json();
      if (!dados.figureString) throw new Error("sem visual");
      prov.figLivre = dados.figureString;
      prov.nick = nick;
      document.getElementById("figLivre").value = dados.figureString;
      aviso.textContent = "Visual de " + nick + " carregado.";
      atualizar();
    } catch (e) {
      aviso.textContent = "Não achei esse nick. Confira se está escrito igualzinho e se o perfil está público.";
    }
  }

  document.getElementById("buscarNick").onclick = buscarNick;
  campoNick.onkeydown = e => { if (e.key === "Enter") buscarNick(); };

  atualizar();
}

/* ------------------------- sessão do Discord ---------------------------
   Esta página só é entregue por /api/app, depois de o servidor conferir o
   token e o IP com o bot do Discord. A pessoa logada vem preenchida abaixo.
   Se alguma rota de /api recusar a sessão depois, o token é apagado e a
   página volta para a entrada pública (public/index.html), que mostra a
   tela de sessão expirada. */

const SESSAO_INICIAL = /*SESSAO*/null;   // preenchido por /api/app — não mexa nesta linha
const CHAVE_TOKEN = "nftse_token";
const CHAVE_MOTIVO = "nftse_motivo";
let sessao = SESSAO_INICIAL;             // { habboName, discordUserId }
let estadoSessao = sessao ? "ATIVA" : "EXPIRADA";
let contagens = {};
let meusFavoritos = new Set();

function lerToken(){
  try { return localStorage.getItem(CHAVE_TOKEN) || ""; } catch (e) { return ""; }
}
function apagarToken(){
  try { localStorage.removeItem(CHAVE_TOKEN); } catch (e) {}
}

// Chamada às rotas de /api levando o token. Se o servidor recusar a sessão,
// sai do catálogo e interrompe quem chamou.
async function apiFetch(url, opcoes = {}){
  const r = await fetch(url, {
    ...opcoes,
    cache: "no-store",
    headers: { ...(opcoes.headers || {}), "x-sessao-token": lerToken() }
  });
  if (r.status === 401 || r.status === 503) {
    const dados = await r.json().catch(() => ({}));
    if (dados.estado) {
      encerrarNaTela(dados.estado);
      throw new Error("sessao recusada");
    }
  }
  return r;
}

let saindo = false;
function encerrarNaTela(estado){
  if (saindo) return;
  saindo = true;
  estadoSessao = estado;
  sessao = null;
  meusFavoritos = new Set();
  // Fora do ar não quer dizer que o token morreu: guarda pra tentar de novo.
  if (estado !== "INDISPONIVEL") apagarToken();
  try { sessionStorage.setItem(CHAVE_MOTIVO, estado); } catch (e) {}
  document.querySelectorAll(".admin-painel").forEach(el => el.remove());
  app.innerHTML = "";
  location.replace(location.pathname + location.search);
}

async function carregarCatalogoExtra(){
  try {
    const r = await apiFetch(API_BASE + "/api/catalogo");
    const dados = await r.json();
    const slugsExistentes = new Set(CATALOGO.map(it => it.slug));
    (dados.itens || []).forEach(it => {
      if (!slugsExistentes.has(it.slug)) { CATALOGO.push(it); slugsExistentes.add(it.slug); }
    });
    const faixas = dados.faixas || {};
    CATALOGO.forEach(it => {
      if (faixas[it.slug]) it.faixa = faixas[it.slug];
    });
  } catch (e) {
    // Sem servidor de catálogo extra no ar ainda: o site continua funcionando,
    // só com os itens que já vêm prontos no arquivo.
  }
}

async function carregarFavoritos(){
  try {
    const r = await apiFetch(API_BASE + "/api/favoritos");
    const dados = await r.json();
    contagens = dados.contagens || {};
    meusFavoritos = new Set(dados.meus || []);
  } catch (e) {
    // Sem servidor de favoritos no ar ainda: o site continua funcionando,
    // só sem os coraçõezinhos preenchidos com número.
  }
}

async function toggleFavorito(slug){
  if (estadoSessao !== "ATIVA") return;
  try {
    const r = await apiFetch(API_BASE + "/api/favoritos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug })
    });
    const dados = await r.json();
    if (!r.ok) { alert(dados.erro || "Não consegui favoritar agora."); return; }
    contagens[slug] = dados.contagem;
    if (dados.favoritado) meusFavoritos.add(slug); else meusFavoritos.delete(slug);
    render();
  } catch (e) {
    if (estadoSessao === "ATIVA") alert("Não consegui falar com o servidor de favoritos agora.");
  }
}

function renderAuthArea(){
  const el = document.getElementById("authArea");
  if (!sessao) { el.innerHTML = ""; return; }
  el.innerHTML = `<a href="#favoritos" class="auth-entrar">♥ Meus favoritos</a>
    <span class="auth-nick">${esc(sessao.habboName)}</span>
    <button type="button" class="auth-sair" id="sairBtn">sair</button>`;
  document.getElementById("sairBtn").onclick = fazerLogout;
}

async function fazerLogout(){
  const token = lerToken();
  apagarToken();
  try {
    await fetch(API_BASE + "/api/sessao/sair", {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token })
    });
  } catch (e) {}
  encerrarNaTela("SAIU");
}

/* --------------------------- painel de admin ------------------------------
   Só aparece se você abrir o site com ?admin=1 no final do endereço,
   ex: catalogo.suasite.com/?admin=1 (com uma sessão do Discord ativa).
   É onde você cadastra itens e marca faixas de preço. */

function montarPainelAdmin(){
  if (new URLSearchParams(location.search).get("admin") !== "1") return;

  if (sessionStorage.getItem("nftse_admin_ok") === "1") {
    montarPainelAdminCompleto();
    return;
  }

  const divLogin = document.createElement("div");
  divLogin.className = "admin-painel";
  divLogin.innerHTML = `
    <h3>Painel de administração</h3>
    <label>Senha de admin<input id="adminSenhaEntrar" type="password" class="figura"></label>
    <button type="button" class="cta" id="adminEntrarBtn" style="margin-top:10px">Entrar</button>
    <p class="dica" id="adminLoginMsg"></p>`;
  document.body.appendChild(divLogin);

  const entrarAdmin = async () => {
    const adminSecret = document.getElementById("adminSenhaEntrar").value;
    const msg = document.getElementById("adminLoginMsg");
    if (!adminSecret) { msg.textContent = "Digite a senha."; return; }
    msg.textContent = "Verificando...";
    try {
      const r = await apiFetch(API_BASE + "/api/catalogo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ acao: "verificar", adminSecret })
      });
      if (!r.ok) { msg.textContent = "Senha incorreta."; return; }
      sessionStorage.setItem("nftse_admin_ok", "1");
      sessionStorage.setItem("nftse_admin_secret", adminSecret);
      divLogin.remove();
      montarPainelAdminCompleto();
    } catch (e) {
      if (estadoSessao === "ATIVA") msg.textContent = "Não consegui verificar agora.";
    }
  };
  document.getElementById("adminEntrarBtn").onclick = entrarAdmin;
  document.getElementById("adminSenhaEntrar").addEventListener("keydown", e => { if (e.key === "Enter") entrarAdmin(); });
}

function montarPainelAdminCompleto(){
  const div = document.createElement("div");
  div.className = "admin-painel";
  div.innerHTML = `
    <h3>Painel de administração</h3>
    <label>Sua senha de admin<input id="adminSecret" type="password" class="figura"></label>

    <h3 style="margin-top:24px">Adicionar item ao catálogo</h3>
    <label>Tipo
      <select id="itemTipo" class="figura">
        <option value="roupa">Visual (roupa)</option>
        <option value="furni">Mobi</option>
        <option value="balao">Balão de fala</option>
      </select>
    </label>
    <label>Nome em português<input id="itemPt" class="figura"></label>
    <label>Nome em inglês<input id="itemEn" class="figura"></label>
    <label>Link da imagem<input id="itemImg" class="figura" placeholder="https://..."></label>
    <div id="itemCamposRoupa">
      <label>Código da peça (se já souber)
        <input id="itemPeca" class="figura" placeholder="ex: cc-5621-0"></label>
      <label>Gênero da peça
        <select id="itemGenero" class="figura">
          <option value="">Unissex / não sei</option>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </label>
    </div>
    <label>Descrição (opcional)<input id="itemDesc" class="figura"></label>
    <label>Faixa de preço (opcional)
      <select id="itemFaixa" class="figura">
        <option value="">Não marcar</option>
        <option value="1">$ (mais barato)</option>
        <option value="2">$$</option>
        <option value="3">$$$</option>
        <option value="4">$$$$ (mais caro)</option>
      </select>
    </label>
    <details style="margin-top:4px">
      <summary class="dica" style="cursor:pointer">Código (slug) manual — opcional</summary>
      <input id="itemSlug" class="figura" style="margin-top:8px" placeholder="Deixe em branco pra gerar sozinho a partir do nome">
    </details>
    <button type="button" class="cta" id="itemCriar" style="margin-top:10px">Adicionar item</button>
    <p class="dica" id="itemMsg"></p>

    <h3 style="margin-top:24px">Faixa de preço de um item já existente</h3>
    <label>Buscar pelo nome
      <span style="display:flex;gap:6px;margin-top:4px">
        <input id="faixaBusca" class="figura" style="margin-top:0" placeholder="Ex: máscara de">
        <button type="button" id="faixaBuscarBtn" class="opt" style="white-space:nowrap">Buscar</button>
      </span>
    </label>
    <div id="faixaResultados" class="dica" style="margin-top:8px"></div>

    <h4 style="margin-top:20px">Itens cadastrados por aqui</h4>
    <div id="itemLista" class="dica">Carregando...</div>`;
  document.body.appendChild(div);
  document.getElementById("adminSecret").value = sessionStorage.getItem("nftse_admin_secret") || "";

  /* ----- cadastro de item novo ----- */

  const campoTipo = document.getElementById("itemTipo");
  const camposRoupa = document.getElementById("itemCamposRoupa");
  const alternarCamposRoupa = () => {
    camposRoupa.style.display = campoTipo.value === "roupa" ? "" : "none";
  };
  campoTipo.onchange = alternarCamposRoupa;
  alternarCamposRoupa();

  async function listarItensPainel(){
    const listaDiv = document.getElementById("itemLista");
    try {
      const r = await apiFetch(API_BASE + "/api/catalogo");
      const dados = await r.json();
      const itens = dados.itens || [];
      if (!itens.length) { listaDiv.textContent = "Nenhum item cadastrado por aqui ainda."; return; }
      listaDiv.innerHTML = itens.map(it => `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--linha)">
          <span>${esc(it.pt)} <span style="opacity:.6">(${esc(it.tipo)})</span></span>
          <button type="button" class="opt" data-remover-item="${esc(it.slug)}" style="padding:4px 8px;font-size:10px">Remover</button>
        </div>`).join("");
      listaDiv.querySelectorAll("[data-remover-item]").forEach(b => b.onclick = async () => {
        const adminSecret = document.getElementById("adminSecret").value;
        if (!adminSecret) { document.getElementById("itemMsg").textContent = "Preencha sua senha de admin ali em cima primeiro."; return; }
        await apiFetch(API_BASE + "/api/catalogo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ acao: "remover", adminSecret, slug: b.dataset.removerItem })
        });
        listarItensPainel();
      });
    } catch (e) {
      listaDiv.textContent = "Não consegui carregar a lista agora.";
    }
  }
  listarItensPainel();

  /* ----- faixa de preço de qualquer item já existente ----- */

  function faixaSelectHTML(atual){
    const opcoes = [["", "Não marcar"], ["1", "$"], ["2", "$$"], ["3", "$$$"], ["4", "$$$$"]];
    return opcoes.map(([v, t]) => `<option value="${v}" ${String(atual || "") === v ? "selected" : ""}>${t}</option>`).join("");
  }

  function buscarItensFaixa(){
    const termo = document.getElementById("faixaBusca").value.trim().toLowerCase();
    const resultados = document.getElementById("faixaResultados");
    if (!termo) { resultados.textContent = "Digite parte do nome pra buscar."; return; }
    const achados = CATALOGO.filter(it => (it.pt + " " + it.en).toLowerCase().includes(termo)).slice(0, 15);
    if (!achados.length) { resultados.textContent = "Nenhum item encontrado."; return; }
    resultados.innerHTML = achados.map(it => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--linha)">
        <span>${esc(it.pt)}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <select class="figura" style="margin-top:0;width:auto" data-faixa-slug="${esc(it.slug)}">${faixaSelectHTML(it.faixa)}</select>
          <button type="button" class="opt" data-faixa-salvar="${esc(it.slug)}" style="padding:4px 8px;font-size:10px">Salvar</button>
        </span>
      </div>`).join("");
    resultados.querySelectorAll("[data-faixa-salvar]").forEach(b => b.onclick = async () => {
      const adminSecret = document.getElementById("adminSecret").value;
      if (!adminSecret) { document.getElementById("itemMsg").textContent = "Preencha sua senha de admin ali em cima primeiro."; return; }
      const slugAlvo = b.dataset.faixaSalvar;
      const select = resultados.querySelector(`select[data-faixa-slug="${CSS.escape(slugAlvo)}"]`);
      const r = await apiFetch(API_BASE + "/api/catalogo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ acao: "definirFaixa", adminSecret, slug: slugAlvo, faixa: select.value })
      });
      if (r.ok) {
        const item = CATALOGO.find(it => it.slug === slugAlvo);
        if (item) { if (select.value) item.faixa = parseInt(select.value, 10); else delete item.faixa; }
        b.textContent = "Salvo!";
        setTimeout(() => { b.textContent = "Salvar"; }, 1500);
      } else {
        b.textContent = "Erro";
      }
    });
  }
  document.getElementById("faixaBuscarBtn").onclick = buscarItensFaixa;
  document.getElementById("faixaBusca").addEventListener("keydown", e => { if (e.key === "Enter") buscarItensFaixa(); });

  document.getElementById("itemCriar").onclick = async () => {
    const adminSecret = document.getElementById("adminSecret").value;
    const msg = document.getElementById("itemMsg");
    const item = {
      tipo: campoTipo.value,
      pt: document.getElementById("itemPt").value.trim(),
      en: document.getElementById("itemEn").value.trim(),
      img: document.getElementById("itemImg").value.trim(),
      desc: document.getElementById("itemDesc").value.trim(),
      slug: document.getElementById("itemSlug").value.trim(),
      faixa: document.getElementById("itemFaixa").value
    };
    if (campoTipo.value === "roupa") {
      item.peca = document.getElementById("itemPeca").value.trim();
      item.genero = document.getElementById("itemGenero").value;
    }
    if (!adminSecret) { msg.textContent = "Preencha sua senha de admin ali em cima."; return; }
    if (!item.pt || !item.en) { msg.textContent = "Preencha ao menos o nome em português e em inglês."; return; }
    sessionStorage.setItem("nftse_admin_secret", adminSecret);
    try {
      const r = await apiFetch(API_BASE + "/api/catalogo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ acao: "criar", adminSecret, item })
      });
      const dados = await r.json();
      if (!r.ok) { msg.textContent = dados.erro || "Erro ao adicionar o item."; return; }
      msg.textContent = `Item "${dados.item.pt}" adicionado! Código: ${dados.item.slug}`;
      document.getElementById("itemFaixa").value = "";
      ["itemPt","itemEn","itemImg","itemPeca","itemDesc","itemSlug"].forEach(id => {
        const campo = document.getElementById(id);
        if (campo) campo.value = "";
      });
      document.getElementById("itemGenero").value = "";
      listarItensPainel();
    } catch (e) {
      msg.textContent = "Não consegui falar com o servidor.";
    }
  };
}

/* ----------------------------- roteamento ------------------------------- */

function render(){
  if (estadoSessao !== "ATIVA") return;
  const rota = location.hash.replace(/^#\/?/, "");
  if (rota.startsWith("item/")) {
    const it = CATALOGO.find(i => i.slug === rota.slice(5));
    if (it) { telaItem(it); window.scrollTo(0, 0); return; }
  }
  if (rota === "favoritos") { telaFavoritos(); window.scrollTo(0, 0); return; }
  if (rota === "editor") { telaEditor(); window.scrollTo(0, 0); return; }
  telaGrade();
}

document.getElementById("busca").oninput = e => {
  termo = e.target.value;
  if (location.hash) location.hash = ""; else render();
};
window.addEventListener("hashchange", render);

(async () => {
  if (estadoSessao !== "ATIVA") { encerrarNaTela("EXPIRADA"); return; }
  renderAuthArea();
  render();
  await Promise.all([carregarCatalogoExtra(), carregarFavoritos()]);
  if (estadoSessao !== "ATIVA") return;
  montarPainelAdmin();
  render();
})();
</script>
