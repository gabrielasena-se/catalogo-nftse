<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Catálogo NFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#150128;
  --painel:#200a3c;
  --tile:#2b0f52;
  --tile-alto:#3c1670;
  --linha:#6a2fc0;
  --topo-fundo-1:#4a12a0;
  --topo-fundo-2:#1a0338;
  --topo-linha:#b048f0;
  --topo-input:#260a4a;
  --texto:#f3e9ff;
  --mudo:#c090e8;
  --ouro:#ff2ee0;
  --verde:#5cb85c;
  --verde-escuro:#3f8c3f;
  --pixel:"Silkscreen","Courier New",monospace;
  --corpo:"Nunito Sans",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fundo);
  color:var(--texto);
  font-family:var(--corpo);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ouro)}

/* ---------- topo ---------- */
.topo{
  background:linear-gradient(180deg,var(--topo-fundo-1),var(--topo-fundo-2));
  border-bottom:2px solid var(--topo-linha);
  position:sticky;top:0;z-index:20;
}
.topo-int{
  max-width:1120px;margin:0 auto;padding:14px 18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.marca{
  display:flex;align-items:center;gap:10px;
  font-family:var(--pixel);font-size:17px;letter-spacing:.5px;
  color:var(--ouro);text-decoration:none;line-height:1.2;
}
.marca img{width:34px;height:34px;flex-shrink:0}
.marca-sub{display:block;font-size:9px;color:var(--mudo);letter-spacing:1px;margin-top:3px}
.busca{
  flex:1;min-width:160px;background:var(--topo-input);border:1px solid var(--topo-linha);
  border-radius:6px;padding:9px 12px;color:var(--texto);font-size:14px;
}
.busca::placeholder{color:#a066c8}
.busca:focus{outline:2px solid var(--ouro);outline-offset:1px}

/* ---------- abas ---------- */
.abas{max-width:1120px;margin:0 auto;padding:22px 18px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aba{
  background:var(--tile);border:1px solid var(--linha);border-bottom:3px solid var(--linha);
  border-radius:6px;padding:9px 16px;font-family:var(--pixel);font-size:11px;color:var(--mudo);
}
.aba[aria-selected="true"]{background:var(--ouro);color:#3a0050;border-color:#b800b8}
.aviso-legal{
  margin-left:auto;max-width:640px;font-size:11px;line-height:1.5;color:var(--mudo);
  opacity:.75;text-align:right;
}
@media(max-width:760px){.aviso-legal{margin-left:0;max-width:100%;text-align:left}}
.linha-info-grade{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;
}
.contador-itens{
  font-family:var(--pixel);font-size:10px;color:var(--mudo);margin:0;
}
.dica-clique{
  font-family:var(--pixel);font-size:10px;color:var(--mudo);opacity:.75;margin:0;
  display:flex;align-items:center;gap:6px;
}
.icone-clique{width:14px;height:14px;flex:none}

/* ---------- grade ---------- */
.envoltorio{max-width:1120px;margin:0 auto;padding:18px}
.grade{
  display:grid;gap:16px;
  grid-template-columns:repeat(4,1fr);
}
@media(max-width:880px){.grade{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grade{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){.grade{grid-template-columns:1fr}}
.card{
  background:var(--tile);border:1px solid var(--linha);border-bottom:3px solid #140026;
  border-radius:8px;padding:0;text-align:left;overflow:hidden;
  display:flex;flex-direction:column;
}
.card:hover,.card:focus-visible{background:var(--tile-alto);outline:none;border-color:var(--ouro)}
.card:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.palco{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(0deg,rgba(0,0,0,.25),rgba(0,0,0,0)),
    repeating-conic-gradient(#200a3c 0% 25%,#280d48 0% 50%) 0 0/16px 16px;
  padding:6px;
}
.palco img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;image-rendering:pixelated}
.vazio{font-family:var(--pixel);font-size:9px;color:#a888d0;text-align:center;padding:0 8px}
.card-txt{padding:10px 11px 12px}
.card-pt{display:block;font-weight:800;font-size:14px;line-height:1.25}
.card-en{display:block;font-size:12px;color:var(--mudo);margin-top:2px}
.card-en-linha{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:2px}
.card-en-linha .card-en{margin-top:0}
.card-faixa{font-family:var(--pixel);font-size:11px;letter-spacing:1px;color:var(--ouro);flex:none}
.cifra-apagada{opacity:.25}
/* Meus visuais */
.visual-card:hover{background:var(--tile);border-color:var(--linha)}
.visual-avatar{height:88%;width:auto;image-rendering:pixelated}
.visual-itens{margin:8px 0 8px;padding:0 0 0 16px;font-size:12px;line-height:1.45;color:var(--texto)}
.visual-itens-basicas{color:var(--mudo);list-style:none;margin-left:-16px}
.visual-itens a{color:var(--texto);text-decoration:underline;text-decoration-color:var(--linha);text-underline-offset:2px}
.visual-itens a:hover{color:var(--ouro);text-decoration-color:var(--ouro)}
/* NFT: o cubo ocupa o lugar da bolinha da lista */
.visual-item-nft{list-style:none;margin-left:-16px;display:flex;align-items:center;gap:4px}
.visual-item-nft img{width:13px;height:13px;flex:none;margin-left:1px}
.visual-item-nft a,.visual-item-nft{font-weight:600}
.visual-acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.visual-acoes .opt{padding:5px 8px;font-size:12px}
.visual-excluir:hover{border-color:#ff5a5a;color:#ff9a9a}

/* ---------- item ---------- */
.voltar{
  background:none;border:none;font-family:var(--pixel);font-size:10px;
  color:var(--mudo);padding:0;margin-bottom:16px;
}
.voltar:hover{color:var(--ouro)}
.item{display:grid;gap:22px;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media(max-width:760px){.item{grid-template-columns:1fr}}
.vitrine{
  background:var(--painel);border:1px solid var(--linha);border-radius:10px;
  padding:18px;display:flex;align-items:center;justify-content:center;min-height:240px;
}
.vitrine img{max-height:220px;width:auto;image-rendering:pixelated}
.item h1{font-family:var(--pixel);font-size:20px;line-height:1.4;margin:0}
.item-en{color:var(--mudo);font-size:15px;margin:6px 0 0}
.selo{
  display:inline-block;background:var(--tile);border:1px solid var(--linha);
  border-radius:20px;padding:3px 11px;font-size:12px;color:var(--mudo);margin-top:12px;margin-right:6px;
}
.desc{margin:16px 0 0;max-width:62ch;color:#e6d4fa}
.cta{
  display:inline-block;margin-top:18px;background:linear-gradient(180deg,#ff2ee0,#b800a0);border:none;
  border-bottom:3px solid #8a0078;border-radius:7px;color:#fff;
  font-family:var(--pixel);font-size:12px;padding:13px 20px;text-decoration:none;
}
.cta:active{border-bottom-width:1px;transform:translateY(2px)}

.secao{margin-top:34px}
.secao h2{font-family:var(--pixel);font-size:12px;color:var(--mudo);margin:0 0 12px}
.gifs{display:flex;gap:12px;flex-wrap:wrap}
.gifs figure{
  margin:0;background:var(--painel);border:1px solid var(--linha);border-radius:10px;
  padding:14px 18px;min-width:120px;text-align:center;
}
.gifs img{image-rendering:pixelated;margin:0 auto}
.gifs figcaption{font-size:11px;color:var(--mudo);margin-top:8px}

/* "Em movimento" à esquerda e o carrossel de visuais dos usuários à direita */
.linha-movimento{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.linha-movimento > .secao{flex:none}
/* Carrossel encostado à direita, mostrando até 3 visuais por vez */
/* Ocupa o espaço que sobra ao lado de "Em movimento" (e encolhe para 2 caixas se preciso,
   em vez de ir para baixo); só desce quando não cabe nem uma caixa. */
.linha-movimento > .secao-comunidade{flex:1 1 0;min-width:260px;max-width:100%;text-align:right}
.secao-comunidade .carrossel{justify-content:flex-end;text-align:left}
.carrossel{display:flex;align-items:center;gap:8px}
.carrossel > .dica{margin:0;max-width:522px}
.carrossel-trilho{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;min-width:0;
  flex:0 1 auto;width:max-content;max-width:522px;padding-bottom:6px;   /* até 3 caixas de 166px + 2 espaços de 12px */
  scrollbar-width:thin;scrollbar-color:#5fc8f0 transparent;
}
.carrossel-trilho::-webkit-scrollbar{height:6px}
.carrossel-trilho::-webkit-scrollbar-thumb{background:#5fc8f0;border-radius:3px}
/* Mesmo tamanho das caixas de "Em movimento", com a borda no azul do cubo NFT */
.carrossel-item{
  flex:none;scroll-snap-align:start;margin:0;background:var(--painel);border:1px solid #5fc8f0;border-radius:10px;
  box-sizing:border-box;width:166px;height:275px;padding:14px 18px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
}
.carrossel-item img{width:128px;height:220px;image-rendering:pixelated}
.carrossel-item .opt{padding:3px 9px;font-size:11px;border-color:#5fc8f0;color:#9fe0fa}
.carrossel-item .opt:hover{background:#5fc8f0;color:#0c2a3a}
.carrossel-seta{flex:none;border-color:#5fc8f0}
.carrossel-seta[hidden]{display:none}
@media(max-width:520px){.carrossel-seta{display:none}}

/* ---------- provador ---------- */
.provador{
  background:var(--painel);border:1px solid var(--linha);border-radius:10px;
  display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden;
}
@media(max-width:700px){.provador{grid-template-columns:1fr}}
.espelho{
  background:
    linear-gradient(180deg,#3a1670,#200a3c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 14px;gap:14px;border-right:1px solid var(--linha);
}
.espelho img{height:250px;width:auto;image-rendering:pixelated}
.opcoes-peles{gap:6px}
.opcoes-peles .cor{width:22px;height:22px}
.provador-editor{align-items:start;overflow:visible}
/* --altura-topo é medida pelo script (a barra do topo muda de altura conforme
   a largura da tela): a coluna para logo abaixo dela, sem ficar escondida. */
.provador-editor .espelho{
  position:sticky;top:calc(var(--altura-topo,0px) + 12px);align-self:start;border-radius:10px 0 0 10px;
  padding-top:16px;padding-bottom:16px;gap:10px;
  /* Com o painel de cores embaixo, a coluna nunca passa da altura da tela
     (se passasse, pararia de acompanhar a rolagem); se faltar espaço, rola por dentro. */
  max-height:calc(100vh - var(--altura-topo,0px) - 24px);overflow-y:auto;justify-content:flex-start;
}
.provador-editor .espelho > *{flex-shrink:0}
.provador-editor .espelho img{height:250px}
/* Copiar código / Salvar visual, lado a lado embaixo do avatar */
.acoes-visual{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.acoes-visual .opt{padding:6px 9px;font-size:12px}
.salvar-visual{display:flex;flex-direction:column;gap:6px;width:100%}
.salvar-visual[hidden]{display:none}
.salvar-visual-linha{display:flex;gap:6px}
/* Caixa de marcar do site: lilás claro, rosa com ✓ branco quando marcada */
.caixa-marcar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mudo);cursor:pointer;line-height:1.3}
.caixa-marcar input{
  appearance:none;-webkit-appearance:none;flex:none;margin:0;cursor:pointer;
  width:16px;height:16px;border-radius:4px;border:2px solid #b89ae8;background:#e6d9ff;
  display:inline-grid;place-content:center;transition:background .1s,border-color .1s;
}
.caixa-marcar input::after{
  content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px);opacity:0;
}
.caixa-marcar input:checked{background:var(--ouro);border-color:var(--ouro)}
.caixa-marcar input:checked::after{opacity:1}
.caixa-marcar input:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.caixa-marcar input:disabled{opacity:.6;cursor:wait}
.caixa-marcar:hover input:not(:checked){border-color:var(--ouro)}
.salvar-visual .figura{flex:1;min-width:0;padding:6px 8px;font-size:12px}
.salvar-visual .opt{padding:6px 9px;font-size:12px}
.painel-cores{width:100%;border-top:1px solid var(--linha);padding-top:12px}
.painel-cores label{display:block;font-size:12px;color:var(--mudo);margin-bottom:6px}
/* As caixas de cores mostram até 5 linhas e encolhem até 3 quando a tela é
   baixa, para a coluna sempre caber inteira na tela. */
.provador-editor .espelho > .painel-cores{flex-shrink:1;min-height:0;display:flex;flex-direction:column}
.painel-cores label{flex-shrink:0}
.cores-rolagem{gap:6px;max-height:140px;min-height:84px;flex:0 1 auto;overflow-y:auto;padding:3px}
.cores-rolagem .cor{width:22px;height:22px}
/* Barra de rolagem fina e roxa, no lugar da cinza padrão do navegador */
.cores-rolagem,.provador-editor .espelho{scrollbar-width:thin;scrollbar-color:var(--linha) transparent}
.cores-rolagem::-webkit-scrollbar,.provador-editor .espelho::-webkit-scrollbar{width:6px}
.cores-rolagem::-webkit-scrollbar-track,.provador-editor .espelho::-webkit-scrollbar-track{background:transparent}
.cores-rolagem::-webkit-scrollbar-thumb,.provador-editor .espelho::-webkit-scrollbar-thumb{background:var(--linha);border-radius:3px}
.cores-rolagem::-webkit-scrollbar-thumb:hover,.provador-editor .espelho::-webkit-scrollbar-thumb:hover{background:var(--mudo)}
@media(max-width:700px){
  .provador-editor .espelho{position:static;border-radius:10px 10px 0 0;max-height:none}
}
.girar{display:flex;gap:8px}
.mini{
  background:var(--tile);border:1px solid var(--linha);border-bottom:2px solid #140026;
  border-radius:5px;width:34px;height:30px;font-size:14px;line-height:1;
}
.mini:hover{background:var(--tile-alto)}
.controles{padding:18px}
.campo{margin-bottom:15px}
.campo label{display:block;font-size:12px;color:var(--mudo);margin-bottom:6px}
.opcoes{display:flex;gap:7px;flex-wrap:wrap}
.opt{
  background:var(--tile);border:1px solid var(--linha);border-radius:5px;
  padding:6px 11px;font-size:13px;color:var(--mudo);
}
.opt[aria-pressed="true"]{background:var(--ouro);color:#3a0050;border-color:#b800b8;font-weight:700}
.cor{width:26px;height:26px;padding:0;border-radius:50%}
.cor[aria-pressed="true"]{outline:2px solid var(--ouro);outline-offset:2px;border-color:#fff}
.figura{
  width:100%;background:var(--fundo);border:1px solid var(--linha);border-radius:6px;
  padding:8px 10px;color:var(--texto);font-size:14px;font-family:var(--corpo);
}
.figura:focus{outline:2px solid var(--ouro);outline-offset:1px;color:var(--texto)}
.dica{font-size:12px;color:var(--mudo);margin:4px 0 0}
.linha-nick{display:flex;gap:7px}
.linha-nick .figura{flex:1}
.linha-nick .opt{white-space:nowrap}
.rodape{
  max-width:1120px;margin:46px auto 0;padding:20px 18px 40px;
  border-top:1px solid var(--linha);color:var(--mudo);font-size:13px;
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- autenticação / favoritos ---------- */
.auth-area{font-size:12px;color:var(--mudo);display:flex;align-items:center;gap:8px}
.auth-entrar,.auth-sair{
  background:none;border:1px solid var(--topo-linha);color:var(--texto);
  border-radius:5px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--corpo);
  text-decoration:none;display:inline-block;
}
.auth-nick{
  color:var(--texto);font-weight:600;
  /* Nick muito comprido termina em "…" para não empurrar o topo; o nick inteiro aparece no title */
  display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;
}
/* "sair" com o visual do antigo botão "Entrar no Discord" */
.auth-sair{
  background:linear-gradient(180deg,#a83cf0,#6c1cc0);border:none;border-bottom:3px solid #4a1090;border-radius:6px;
  color:#fff;font-family:var(--pixel);font-size:11px;letter-spacing:1.5px;padding:9px 14px;
}
.auth-sair:active{border-bottom-width:1px;transform:translateY(2px)}
.link-editor{border-color:var(--ouro);color:var(--ouro)}
.link-editor:hover{background:var(--ouro);color:#3a0050}

.card-cabecalho{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.coracao{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--mudo);font-size:12px;padding:2px;flex-shrink:0;cursor:pointer;font-family:var(--corpo);
}
.coracao-icone{font-size:15px;line-height:1}
.coracao[aria-pressed="true"]{color:var(--ouro)}
.coracao-grande{font-size:16px}
.coracao-grande .coracao-icone{font-size:22px}

.admin-painel{
  position:fixed;bottom:16px;right:16px;background:var(--painel);
  border:1px solid var(--linha);border-radius:10px;padding:16px;width:240px;
  z-index:90;box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.admin-painel h3{font-family:var(--pixel);font-size:12px;margin:0 0 8px}
.admin-painel label{display:block;font-size:11px;color:var(--mudo);margin-top:8px}
.admin-painel label input{width:100%;margin-top:4px}

.opcoes-itens{display:grid;grid-template-columns:repeat(auto-fill,104px);gap:8px;justify-content:center}
@media(max-width:520px){.opcoes-itens{grid-template-columns:repeat(auto-fill,80px)}}
.item-mini{
  width:104px;height:104px;padding:4px;border-radius:8px;flex-shrink:0;position:relative;
  border:2px solid var(--linha);cursor:pointer;
  background:repeating-conic-gradient(#200a3c 0% 25%,#280d48 0% 50%) 0 0/10px 10px;
  display:flex;align-items:center;justify-content:center;
}
.item-mini[aria-pressed="true"]{border-color:var(--ouro)}
.item-mini img{max-width:100%;max-height:100%}
.item-mini .recorte{position:relative;width:100%;height:100%;overflow:hidden}
.item-mini .recorte-corpo{
  position:relative;width:100%;height:100%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.item-mini img.mini-zoom{
  position:absolute;left:50%;max-width:none;max-height:none;width:145%;height:auto;
  transform:translateX(-50%);
}
.item-mini img.mini-zoom-cima{top:auto;bottom:-40px}
.item-mini img.mini-zoom-baixo{top:auto;bottom:0}
.item-mini img.mini-zoom-tronco{width:118%;top:-62px}
.item-mini img.mini-zoom-acessorio{width:136%;top:auto;bottom:-36px}
.item-mini img.mini-zoom-cintura{width:104%;top:auto;bottom:-12px}
.item-mini img.mini-zoom-mao{width:80%;top:auto;bottom:-8px}
.item-mini img.mini-zoom-mascote{width:86%;top:auto;bottom:-8px}
.item-mini img.mini-zoom-corpo{transform:scale(1.12)}
.item-mini::after{
  content:attr(data-codigo);position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:#0c0016;color:var(--texto);font-size:11px;padding:3px 7px;border-radius:4px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:5;
  border:1px solid var(--linha);
}
.item-mini:hover::after,.item-mini:focus::after{opacity:1}
@media(max-width:520px){.item-mini{width:80px;height:80px}}
.item-mini[aria-pressed="true"]{border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro)}
.selo-origem{
  position:absolute;top:2px;left:2px;width:30px;height:30px;z-index:4;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));cursor:help;
}
.selo-img{display:flex;align-items:center;justify-content:center}
.selo-img img{width:100%;height:100%;image-rendering:pixelated}
.selo-ltd{width:34px;height:17px;top:4px}
.selo-h{
  border-radius:7px;background:linear-gradient(180deg,#ff2ee0,#b800a0);
  border:2px solid #3a0050;color:#fff;font-family:var(--pixel);font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.5);filter:none;
}
/* Tamanhos pensados para ficar na mesma proporção do cubo NFT (≈16px visíveis) */
.selo-habbo{width:16px;height:16px;top:9px;left:9px}
.selo-cambio{width:18px;height:18px;top:8px;left:8px}
.selo-raro{width:9px;height:20px;top:7px;left:12px}
.selo-ducket{width:18px;height:18px;top:8px;left:8px}
.selo-habbo img,.selo-cambio img,.selo-raro img,.selo-ducket img{image-rendering:auto}
.selo-p{
  background:linear-gradient(180deg,#b27aff,#5a1ab8);
  width:18px;height:18px;top:8px;left:8px;border-width:1px;border-radius:4px;font-size:10px;
}
/* Explicação do selo ao passar o mouse; esconde o nome da peça enquanto isso */
.selo-origem::after{
  content:attr(data-explica);position:absolute;top:calc(100% + 5px);left:-2px;
  white-space:nowrap;
  background:#0c0016;color:var(--texto);border:1px solid var(--linha);border-radius:4px;
  padding:4px 7px;font-family:var(--corpo);font-size:11px;font-weight:400;
  opacity:0;pointer-events:none;transition:opacity .1s;z-index:6;
}
.selo-origem:hover::after{opacity:1}
.item-mini:has(.selo-origem:hover)::after{opacity:0}
</style>

// Traduz o "tipo" do figure string (as duas letrinhas no começo do código
// da peça, tipo "ha" em "ha-1012-1339") pro nome da categoria em português.
const CATEGORIAS_PECA = {
  hd:"Pele/Rosto", hr:"Cabelo", ch:"Camisa", cc:"Casaco/Jaqueta",
  ca:"Acessório", cp:"Estampa", lg:"Calça", sh:"Sapato",
  ha:"Chapéu", he:"Acessório de Cabeça", ea:"Óculos", fa:"Acessório de Rosto",
  wa:"Cinto", mc:"Item de Mão", pt:"Mascote"
};

// "peca" pode ter várias partes separadas por ponto (ex.: vestido = camisa + acessório);
// "pecaF", quando existe, é a versão do avatar feminino.
function pecaDoItem(it, genero){
  return (genero === "F" && it.pecaF) || it.peca || "";
}

// Categoria principal (a da primeira parte), para o selo da página do item.
function categoriaDoItem(it){
  return categoriasDoItem(it)[0] || null;
}
// Todas as categorias do item, para a busca achar por qualquer uma delas.
function categoriasDoItem(it){
  if (!it.peca) return [];
  return [...new Set(it.peca.split(".").map(p => CATEGORIAS_PECA[p.split("-")[0]]).filter(Boolean))];
}

// Veste as partes da peça na lista do visual, trocando as do mesmo tipo.
function vestirPecas(lista, peca){
  const out = [...lista];
  for (const parte of String(peca || "").split(".").filter(Boolean)) {
    const tipo = parte.split("-")[0];
    const i = out.findIndex(p => p.split("-")[0] === tipo);
    if (i >= 0) out[i] = parte; else out.push(parte);
  }
  return out;
}

// Avatar padrão do gênero escolhido, com o tom de pele do provador, vestindo a peça.
function figura(estado, peca){
  const base = BASE_POR_GENERO[estado.genero] || BASE_POR_GENERO.M;
  const [tipoHd, idHd, corHd] = base.hd.split("-");
  const partes = [`${tipoHd}-${idHd}-${estado.pele || corHd}`, base.hr, base.ch, base.lg];
  return vestirPecas(partes, peca).join(".");
}

function urlAvatar(fig, o = {}){
  const q = new URLSearchParams({
    figure: fig,
    direction: o.dir ?? 2,
    head_direction: o.dir ?? 2,
    action: o.acao ?? "std",
    gesture: o.gesto ?? "std",
    size: o.size ?? "l",
    img_format: o.formato ?? "png",
    gender: o.genero ?? "M"
  });
  return HOTEL + "/habbo-imaging/avatarimage?" + q;
}

let meusVisuais = null;   // lista vinda de /api/visuais; null = ainda não carregada

async function carregarVisuais(){
  const r = await apiFetch(API_BASE + "/api/visuais");
  const dados = await r.json();
  if (!r.ok) throw new Error(dados.erro || "erro");
  meusVisuais = dados.visuais || [];
}

async function salvarVisual(nome, figura, genero, publico){
  try {
    const r = await apiFetch(API_BASE + "/api/visuais", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, figura, genero, publico })
    });
    const dados = await r.json();
    if (!r.ok) return { ok: false, erro: dados.erro || "Não consegui salvar agora." };
    if (meusVisuais) meusVisuais.unshift(dados.visual);
    return { ok: true };
  } catch (e) {
    return { ok: false, erro: "Não consegui falar com o servidor agora." };
  }
}

async function excluirVisual(id){
  const r = await apiFetch(API_BASE + "/api/visuais", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id })
  });
  if (!r.ok) throw new Error("erro");
  meusVisuais = (meusVisuais || []).filter(v => v.id !== id);
}

async function mudarPublicoVisual(id, publico){
  const r = await apiFetch(API_BASE + "/api/visuais", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, publico })
  });
  if (!r.ok) throw new Error("erro");
  const v = (meusVisuais || []).find(x => x.id === id);
  if (v) v.publico = publico;
}

function dataCurta(ms){

// Peça ("tipo-id", sem cor) -> item do catálogo que a veste, para virar link.
let catalogoPorPeca = null;
function itemDoCatalogoPorPeca(tipoId){
  if (!catalogoPorPeca) {
    catalogoPorPeca = {};
    CATALOGO.forEach(it => [it.peca, it.pecaF].filter(Boolean).forEach(peca =>
      peca.split(".").forEach(p => {
        const chave = p.split("-").slice(0, 2).join("-");
        if (!catalogoPorPeca[chave]) catalogoPorPeca[chave] = it;
      })));
  }
  return catalogoPorPeca[tipoId] || null;
}

// Itens usados num visual, pelos nomes do editor. NFTs ganham o cubo e, quando
// estão no catálogo, viram link para a página do item. Peças sem nome
// (grátis/HC) entram só pela categoria, agrupadas no fim.
function itensDoVisualHTML(figura){
  const itens = [], vistos = new Set(), basicas = [];
  for (const parte of String(figura).split(".").filter(Boolean)) {
    const [tipo, id] = parte.split("-");
    const info = (INDICE_ITENS_EDITOR[tipo] || {})[id];
    if (info && info.nome) {
      const doCatalogo = itemDoCatalogoPorPeca(tipo + "-" + id);
      const chave = doCatalogo ? doCatalogo.slug : info.nome;
      if (vistos.has(chave)) continue;
      vistos.add(chave);
      itens.push({ nome: info.nome, nft: info.origem === "nft", slug: doCatalogo && doCatalogo.slug });
    }
    else if (CATEGORIAS_PECA[tipo] && !basicas.includes(CATEGORIAS_PECA[tipo])) basicas.push(CATEGORIAS_PECA[tipo]);
  }
  return `<ul class="visual-itens">
      ${itens.map(i => `<li${i.nft ? ' class="visual-item-nft"' : ""}>
        ${i.nft ? `<img src="${CUBO_NFT_B64}" alt="NFT" title="NFT">` : ""}
        ${i.slug ? `<a href="#item/${esc(i.slug)}">${esc(i.nome)}</a>` : esc(i.nome)}
      </li>`).join("")}
      ${basicas.length ? `<li class="visual-itens-basicas">Básicas: ${esc(basicas.join(", "))}</li>` : ""}
    </ul>`;
}

async function telaVisuais(){
  const cabecalho = `

      app.querySelector(".envoltorio p.dica:last-child").textContent = "Não consegui carregar seus visuais agora. Tente de novo em instantes.";

  }

  const cartoes = meusVisuais.map(v => `
    <div class="card visual-card">
      <span class="palco"><img class="visual-avatar" loading="lazy" alt=""
        src="${esc(urlAvatar(v.figura, { dir: 2, size: "l", genero: v.genero }))}"></span>
      <span class="card-txt">

        ${itensDoVisualHTML(v.figura)}
        <label class="caixa-marcar">
          <input type="checkbox" data-publico="${esc(v.id)}" ${v.publico === false ? "" : "checked"}>
          Mostrar meu visual na página de itens
        </label>
        <span class="visual-acoes">
          <button type="button" class="opt" data-abrir="${esc(v.id)}">Abrir no editor</button>
          <button type="button" class="opt" data-copiar="${esc(v.id)}">Copiar código</button>
          <button type="button" class="opt visual-excluir" data-excluir="${esc(v.id)}">Excluir</button>
        </span>
      </span>
    </div>`).join("");

  app.innerHTML = `
    <div class="envoltorio">
      ${cabecalho}
      ${meusVisuais.length ? `<div class="grade">${cartoes}</div>` : `
        <p style="color:var(--mudo)">Você ainda não salvou nenhum visual. Monte um no
          <a href="#editor">Editor de Visuais</a> e clique em "Salvar visual".</p>`}
    </div>`;

  document.getElementById("voltarVisuais").onclick = () => { location.hash = ""; };
  const achar = id => meusVisuais.find(v => v.id === id);

  app.querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => {
    const v = achar(b.dataset.abrir);
    if (v) abrirVisualNoEditor(v.figura, v.genero);
  });

  app.querySelectorAll("[data-publico]").forEach(c => c.onchange = async () => {
    c.disabled = true;
    try { await mudarPublicoVisual(c.dataset.publico, c.checked); }
    catch (e) {
      c.checked = !c.checked;
      if (estadoSessao === "ATIVA") alert("Não consegui mudar agora. Tente de novo em instantes.");
    }
    c.disabled = false;
  });

  app.querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => {
    const v = achar(b.dataset.copiar);
    if (!v) return;
    try { await navigator.clipboard.writeText(v.figura); b.textContent = "Copiado!"; }
    catch (e) { prompt("Copie o código do visual:", v.figura); }
  });

  app.querySelectorAll("[data-excluir]").forEach(b => b.onclick = async () => {
    const v = achar(b.dataset.excluir);
    if (!v || !confirm(`Excluir o visual "${v.nome}"?`)) return;
    b.disabled = true;
    try { await excluirVisual(v.id); telaVisuais(); }
    catch (e) {
      b.disabled = false;
      if (estadoSessao === "ATIVA") alert("Não consegui excluir agora. Tente de novo em instantes.");
    }
  });
}

function seloEditorHTML(origem){
  const s = SELOS_EDITOR[origem];
  if (!s) return "";
  const conteudo = s.img ? `<img src="${s.img}" alt="">` : s.letra;
  return `<span class="selo-origem ${s.img ? "selo-img" : "selo-h"} ${s.classe || ""}" data-explica="${esc(s.explica)}" aria-label="${esc(s.explica)}">${conteudo}</span>`;
}

// Peças de "hd" que substituem a cabeça inteira — quando uma destas está
// selecionada, o cabelo (hr) não deve aparecer por cima, mesmo que esteja escolhido.
const HD_SEM_CABELO_EDITOR = new Set(["6519","6520"]);

function removerCabeloEditor(lista){
  return lista.filter(p => p.split("-")[0] !== "hr");
}

function figuraMultipla(){
  let lista;
  if (prov.figLivre.trim()) {
    lista = prov.figLivre.trim().split(".").filter(Boolean);
  } else {
    const base = BASE_POR_GENERO[prov.genero] || BASE_POR_GENERO.M;
    lista = [base.hd, base.hr, base.ch, base.lg];
  }
  Object.entries(editorSelecionados).forEach(([tipo, sel]) => {
    const codigo = pecaParaFigura(tipo, sel);
    const i = lista.findIndex(p => p.split("-")[0] === tipo);
    if (codigo) { if (i >= 0) lista[i] = codigo; else lista.push(codigo); }
    else if (i >= 0) { lista.splice(i, 1); }
  });
  const hdSelecionado = editorSelecionados.hd;
  if (hdSelecionado && HD_SEM_CABELO_EDITOR.has(hdSelecionado.id)) lista = removerCabeloEditor(lista);
  return lista.join(".");
}

// Miniatura de uma opção: o avatar padrão do gênero vestindo só aquela peça,
// sem acumular o que já foi escolhido (isso fica só na prévia grande).
function figuraComCandidatoEditor(tipo, set){
  const base = BASE_POR_GENERO[prov.genero] || BASE_POR_GENERO.M;
  let lista = [base.hd, base.hr, base.ch, base.lg];
  const paleta = FIGUREDATA_COMPLETO.palettes[FIGUREDATA_COMPLETO.settypes[tipo].paletteid] || [];
  const i = lista.findIndex(p => p.split("-")[0] === tipo);
  const sel = editorSelecionados[tipo];
  const corAtual = sel && sel.colors && sel.colors[0];
  const corPadrao = corAtual || (paleta[0] || { id: "1" }).id;
  const codigo = tipo + "-" + set.id + "-" + corPadrao + (set.maxCor >= 2 ? "-" + corPadrao : "");
  if (i >= 0) lista[i] = codigo; else lista.push(codigo);
  if (tipo === "hd" && HD_SEM_CABELO_EDITOR.has(set.id)) lista = removerCabeloEditor(lista);
  return lista.join(".");
}

function urlMiniaturaEditor(tipo, set){
  const fig = figuraComCandidatoEditor(tipo, set);
  const url = urlAvatar(fig, { dir: 2, size: "l", genero: prov.genero, acao: "std" });
  return TIPOS_CABECA_EDITOR.has(tipo) ? url + "&headonly=1" : url;
}

      campoNomeVisual.value = "";
      msg.innerHTML = `Visual salvo! <a href="#visuais">Ver meus visuais</a>`;
    } else {
      msg.textContent = resultado.erro;
    }
  }
  document.getElementById("confirmarSalvarVisual").onclick = confirmarSalvarVisual;
  campoNomeVisual.onkeydown = e => {
    if (e.key === "Enter") confirmarSalvarVisual();
    if (e.key === "Escape") formSalvar.hidden = true;
  };

  const campoNickEditor = document.getElementById("nickEditor");
  const avisoEditor = document.getElementById("avisoNickEditor");

  async function buscarNickEditor(){
    const nick = campoNickEditor.value.trim();
    if (!nick) return;
    avisoEditor.textContent = "Procurando " + nick + "...";
    try {
      const url = PROXY
        ? PROXY + encodeURIComponent(nick)
        : HOTEL + "/api/public/users?name=" + encodeURIComponent(nick);
      const r = PROXY ? await apiFetch(url) : await fetch(url);
      if (!r.ok) throw new Error("nao encontrado");
      const dados = await r.json();
      if (!dados.figureString) throw new Error("sem visual");
      prov.figLivre = dados.figureString;
      prov.nick = nick;
      if (dados.gender) prov.genero = dados.gender;
      document.getElementById("figLivreEditor").value = dados.figureString;
      avisoEditor.textContent = "Visual de " + nick + " carregado.";
      atualizarEditor();
    } catch (e) {
      avisoEditor.textContent = "Não achei esse nick. Confira se está escrito igualzinho e se o perfil está público.";
    }
  }

  document.getElementById("buscarNickEditor").onclick = buscarNickEditor;
  campoNickEditor.onkeydown = e => { if (e.key === "Enter") buscarNickEditor(); };

  atualizarEditor();
}

// Carrossel da página do item: visuais públicos de qualquer pessoa que usam o item
// (em qualquer versão, masculina ou feminina). Nunca mostra quem criou.
async function carregarCarrosselVisuais(it){
  const caixa = document.getElementById("carrosselVisuais");
  const semCor = peca => peca.split(".").map(p => p.split("-").slice(0, 2).join("-")).join(".");
  const versoes = [...new Set([it.peca, it.pecaF].filter(Boolean).map(semCor))];
  let visuais = [];
  try {
    const r = await apiFetch(API_BASE + "/api/visuais?item=" + encodeURIComponent(versoes.join("|")));
    const dados = await r.json();
    if (!r.ok) throw new Error(dados.erro || "erro");
    visuais = dados.visuais || [];
  } catch (e) {
    if (caixa && estadoSessao === "ATIVA") caixa.innerHTML = `<p class="dica">Não consegui carregar os visuais agora.</p>`;
    return;
  }
  if (!caixa || !document.body.contains(caixa)) return;   // a pessoa já saiu da página
  if (!visuais.length) {
    caixa.innerHTML = `<p class="dica">Ninguém salvou um visual com este item ainda.
      Monte o seu no <a href="#editor">Editor de Visuais</a>!</p>`;
    return;
  }
  caixa.innerHTML = `
    <button type="button" class="mini carrossel-seta" data-seta="-1" aria-label="Anteriores">&#8592;</button>
    <div class="carrossel-trilho">
      ${visuais.map((v, i) => `
        <figure class="carrossel-item">
          <img loading="lazy" alt="Visual salvo por um usuário"
            src="${esc(urlAvatar(v.figura, { dir: 2, size: "l", genero: v.genero }))}">
          <button type="button" class="opt" data-experimentar="${i}">Experimentar</button>
        </figure>`).join("")}
    </div>
    <button type="button" class="mini carrossel-seta" data-seta="1" aria-label="Próximos">&#8594;</button>`;
  const trilho = caixa.querySelector(".carrossel-trilho");
  // Mostra só caixas inteiras (3, 2 ou 1, conforme o espaço ao lado de "Em movimento")
  // e as setas só quando há visuais escondidos para o lado.
  const setas = [...caixa.querySelectorAll("[data-seta]")];
  const LARGURA_CAIXA = 166, ESPACO = 12;
  const ajustar = () => {
    setas.forEach(b => b.hidden = false);
    const larguraSetas = setas.filter(b => getComputedStyle(b).display !== "none")
      .reduce((soma, b) => soma + b.offsetWidth + 8, 0);
    const cabem = Math.floor((caixa.clientWidth - larguraSetas + ESPACO) / (LARGURA_CAIXA + ESPACO));
    const qtd = Math.max(1, Math.min(3, cabem));
    trilho.style.maxWidth = (qtd * (LARGURA_CAIXA + ESPACO) - ESPACO) + "px";
    const cabeTudo = trilho.scrollWidth <= trilho.clientWidth + 1;
    setas.forEach(b => b.hidden = cabeTudo);
    // O título termina junto da última caixa, não da seta →.
    const titulo = document.getElementById("tituloVisuaisUsuarios");
    const setaDireita = setas[1];
    if (titulo) titulo.style.paddingRight =
      (setaDireita && !setaDireita.hidden && getComputedStyle(setaDireita).display !== "none")
        ? (setaDireita.offsetWidth + 8) + "px" : "";
  };
  ajustar();
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(caixa);
  caixa.querySelectorAll("[data-seta]").forEach(b => b.onclick = () =>
    trilho.scrollBy({ left: Number(b.dataset.seta) * trilho.clientWidth * 0.8, behavior: "smooth" }));
  caixa.querySelectorAll("[data-experimentar]").forEach(b => b.onclick = () => {
    const v = visuais[Number(b.dataset.experimentar)];
    if (v) abrirVisualNoEditor(v.figura, v.genero);
  });
}

function ligarProvador(it){
  const img = document.getElementById("espelhoImg");
  let ultimoGif = "";

  function atualizar(){
    const peca = pecaDoItem(it, prov.genero);
    const fig = prov.figLivre.trim()
      ? vestirPecas(prov.figLivre.trim().split(".").filter(Boolean), peca).join(".")
      : figura(prov, peca);
    img.src = urlAvatar(fig, { dir:prov.dir, acao:prov.acao, size:"l", genero:prov.genero });
    // As animações acompanham o mesmo avatar do provador (só recarregam se o visual mudou).
    if (fig + prov.genero === ultimoGif) return;
    ultimoGif = fig + prov.genero;
    const acenando = document.getElementById("gifAcenando");
    const andando = document.getElementById("gifAndando");
    if (acenando) acenando.src = urlAvatar(fig, { dir:2, acao:"wav", formato:"gif", genero:prov.genero });
    if (andando) andando.src = urlAvatar(fig, { dir:4, acao:"wlk", formato:"gif", genero:prov.genero });
  }

  app.querySelectorAll("[data-campo]").forEach(b => b.onclick = () => {
    prov[b.dataset.campo] = b.dataset.valor;
    app.querySelectorAll(`[data-campo="${b.dataset.campo}"]`)
       .forEach(o => o.setAttribute("aria-pressed", o === b));
    atualizar();
  });

  document.getElementById("girarEsq").onclick = () => { prov.dir = (prov.dir + 7) % 8; atualizar(); };
  document.getElementById("girarDir").onclick = () => { prov.dir = (prov.dir + 1) % 8; atualizar(); };
  document.getElementById("figLivre").oninput = e => { prov.figLivre = e.target.value; atualizar(); };

  const campoNick = document.getElementById("nick");
  const aviso = document.getElementById("avisoNick");

  async function buscarNick(){
    const nick = campoNick.value.trim();
    if (!nick) return;
    aviso.textContent = "Procurando " + nick + "...";
    try {
      const url = PROXY
        ? PROXY + encodeURIComponent(nick)
        : HOTEL + "/api/public/users?name=" + encodeURIComponent(nick);
      const r = PROXY ? await apiFetch(url) : await fetch(url);
      if (!r.ok) throw new Error("nao encontrado");
      const dados = await r.json();
      if (!dados.figureString) throw new Error("sem visual");
      prov.figLivre = dados.figureString;
      prov.nick = nick;
      document.getElementById("figLivre").value = dados.figureString;
      aviso.textContent = "Visual de " + nick + " carregado.";
      atualizar();
    } catch (e) {
      aviso.textContent = "Não achei esse nick. Confira se está escrito igualzinho e se o perfil está público.";
    }
  }

  document.getElementById("buscarNick").onclick = buscarNick;
  campoNick.onkeydown = e => { if (e.key === "Enter") buscarNick(); };

  atualizar();
}

/* ------------------------- sessão do Discord ---------------------------
   Esta página só é entregue por /api/app, depois de o servidor conferir o
   token e o IP com o bot do Discord. A pessoa logada vem preenchida abaixo.
   Se alguma rota de /api recusar a sessão depois, o token é apagado e a
   página volta para a entrada pública (public/index.html), que mostra a
   tela de sessão expirada. */

const SESSAO_INICIAL = /*SESSAO*/null;   // preenchido por /api/app — não mexa nesta linha
const CHAVE_TOKEN = "nftse_token";
const CHAVE_MOTIVO = "nftse_motivo";
let sessao = SESSAO_INICIAL;             // { habboName, discordUserId }
let estadoSessao = sessao ? "ATIVA" : "EXPIRADA";
let contagens = {};
let meusFavoritos = new Set();

function lerToken(){
  try { return localStorage.getItem(CHAVE_TOKEN) || ""; } catch (e) { return ""; }
}
function apagarToken(){
  try { localStorage.removeItem(CHAVE_TOKEN); } catch (e) {}
}

// Chamada às rotas de /api levando o token. Se o servidor recusar a sessão,
// sai do catálogo e interrompe quem chamou.
async function apiFetch(url, opcoes = {}){
  const r = await fetch(url, {
    ...opcoes,
    cache: "no-store",
    headers: { ...(opcoes.headers || {}), "x-sessao-token": lerToken() }
  });
  if (r.status === 401 || r.status === 503) {
    const dados = await r.json().catch(() => ({}));
    if (dados.estado) {
      encerrarNaTela(dados.estado);
      throw new Error("sessao recusada");
    }
  }
  return r;
}

let saindo = false;
function encerrarNaTela(estado){
  if (saindo) return;
  saindo = true;
  estadoSessao = estado;
  sessao = null;
  meusFavoritos = new Set();
  meusVisuais = null;
  // Fora do ar não quer dizer que o token morreu: guarda pra tentar de novo.
  if (estado !== "INDISPONIVEL") apagarToken();
  try { sessionStorage.setItem(CHAVE_MOTIVO, estado); } catch (e) {}
  document.querySelectorAll(".admin-painel").forEach(el => el.remove());
  app.innerHTML = "";
  location.replace(location.pathname + location.search);
}

async function carregarCatalogoExtra(){
  try {
    const r = await apiFetch(API_BASE + "/api/catalogo");
    const dados = await r.json();
    const slugsExistentes = new Set(CATALOGO.map(it => it.slug));
    (dados.itens || []).forEach(it => {
      if (!slugsExistentes.has(it.slug)) { CATALOGO.push(it); slugsExistentes.add(it.slug); }
    });
    const faixas = dados.faixas || {};
    CATALOGO.forEach(it => {
      if (faixas[it.slug]) it.faixa = faixas[it.slug];
    });
    catalogoPorPeca = null;   // itens novos: refaz o índice peça -> item na próxima consulta
  } catch (e) {
    // Sem servidor de catálogo extra no ar ainda: o site continua funcionando,
    // só com os itens que já vêm prontos no arquivo.
  }
}

async function toggleFavorito(slug){
  if (estadoSessao !== "ATIVA") return;
  try {
    const r = await apiFetch(API_BASE + "/api/favoritos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug })
    });
    const dados = await r.json();
    if (!r.ok) { alert(dados.erro || "Não consegui favoritar agora."); return; }
    contagens[slug] = dados.contagem;
    if (dados.favoritado) meusFavoritos.add(slug); else meusFavoritos.delete(slug);
    render();
  } catch (e) {
    if (estadoSessao === "ATIVA") alert("Não consegui falar com o servidor de favoritos agora.");
  }
}

async function fazerLogout(){
  const token = lerToken();
  apagarToken();
  try {
    await fetch(API_BASE + "/api/sessao/sair", {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token })
    });
  } catch (e) {}
  encerrarNaTela("SAIU");
}

function montarPainelAdmin(){
  if (new URLSearchParams(location.search).get("admin") !== "1") return;

  if (sessionStorage.getItem("nftse_admin_ok") === "1") {
    montarPainelAdminCompleto();
    return;
  }

  const divLogin = document.createElement("div");
  divLogin.className = "admin-painel";
  divLogin.innerHTML = `

    <label>Senha de admin<input id="adminSenhaEntrar" type="password" class="figura"></label>

    <p class="dica" id="adminLoginMsg"></p>`;
  document.body.appendChild(divLogin);

  const entrarAdmin = async () => {

    if (!adminSecret) { msg.textContent = "Digite a senha."; return; }
    msg.textContent = "Verificando...";
    try {
      const r = await apiFetch(API_BASE + "/api/catalogo", {
        method: "POST",

        body: JSON.stringify({ acao: "verificar", adminSecret })
      });
      if (!r.ok) { msg.textContent = "Senha incorreta."; return; }

      montarPainelAdminCompleto();
    } catch (e) {
      if (estadoSessao === "ATIVA") msg.textContent = "Não consegui verificar agora.";

    });
  }
  document.getElementById("faixaBuscarBtn").onclick = buscarItensFaixa;
  document.getElementById("faixaBusca").addEventListener("keydown", e => { if (e.key === "Enter") buscarItensFaixa(); });

  document.getElementById("itemCriar").onclick = async () => {
    const adminSecret = document.getElementById("adminSecret").value;
    const msg = document.getElementById("itemMsg");
    const item = {
      tipo: campoTipo.value,
      pt: document.getElementById("itemPt").value.trim(),
      en: document.getElementById("itemEn").value.trim(),
      img: document.getElementById("itemImg").value.trim(),
      desc: document.getElementById("itemDesc").value.trim(),
      slug: document.getElementById("itemSlug").value.trim(),
      faixa: document.getElementById("itemFaixa").value
    };
    if (campoTipo.value === "roupa") {
      item.peca = document.getElementById("itemPeca").value.trim();
      item.genero = document.getElementById("itemGenero").value;
    }
    if (!adminSecret) { msg.textContent = "Preencha sua senha de admin ali em cima."; return; }
    if (!item.pt || !item.en) { msg.textContent = "Preencha ao menos o nome em português e em inglês."; return; }
    sessionStorage.setItem("nftse_admin_secret", adminSecret);
    try {
      const r = await apiFetch(API_BASE + "/api/catalogo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ acao: "criar", adminSecret, item })
      });
      const dados = await r.json();
      if (!r.ok) { msg.textContent = dados.erro || "Erro ao adicionar o item."; return; }
      msg.textContent = `Item "${dados.item.pt}" adicionado! Código: ${dados.item.slug}`;
      document.getElementById("itemFaixa").value = "";
      ["itemPt","itemEn","itemImg","itemPeca","itemDesc","itemSlug"].forEach(id => {
        const campo = document.getElementById(id);
        if (campo) campo.value = "";
      });
      document.getElementById("itemGenero").value = "";
      listarItensPainel();
    } catch (e) {
      msg.textContent = "Não consegui falar com o servidor.";
    }
  };
}

/* ----------------------------- roteamento ------------------------------- */

function render(){
  if (estadoSessao !== "ATIVA") return;
  const rota = location.hash.replace(/^#\/?/, "");
  if (rota.startsWith("item/")) {
    const it = CATALOGO.find(i => i.slug === rota.slice(5));
    if (it) { telaItem(it); window.scrollTo(0, 0); return; }
  }
  if (rota === "favoritos") { telaFavoritos(); window.scrollTo(0, 0); return; }
  if (rota === "visuais") { telaVisuais(); window.scrollTo(0, 0); return; }
  if (rota === "editor") { telaEditor(); window.scrollTo(0, 0); return; }
  telaGrade();
}

document.getElementById("busca").oninput = e => {
  termo = e.target.value;
  if (location.hash) location.hash = ""; else render();
};
window.addEventListener("hashchange", render);

(async () => {
  if (estadoSessao !== "ATIVA") { encerrarNaTela("EXPIRADA"); return; }
  renderAuthArea();
  render();
  await Promise.all([carregarCatalogoExtra(), carregarFavoritos()]);
  if (estadoSessao !== "ATIVA") return;
  montarPainelAdmin();
  render();
})();
</script>
